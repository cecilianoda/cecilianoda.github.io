<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GitHub Pages</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        color: #f5f5f5;
        background: #111111;
      }

      main {
        width: 100%;
        max-width: 600px;
        padding: 48px 32px;
        text-align: center;
        border: 1px solid #333333;
        border-radius: 16px;
        background: #1a1a1a;
      }

      h1 {
        margin-bottom: 16px;
        font-size: clamp(2rem, 6vw, 3.5rem);
      }

      p {
        color: #aaaaaa;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      .status {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 16px;
        color: #8cffaa;
        border: 1px solid #347a48;
        border-radius: 999px;
        background: #193521;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Deploy funcionando 🚀</h1>

      <p>Esta página foi publicada com GitHub Pages.</p>

      <span class="status">Initial commit realizado</span>
    </main>
  </body>
</html>
